name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Check diff integrity
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Validate asset catalog
        run: npm run assets:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit critical vulnerabilities
        run: npm audit --audit-level=critical
